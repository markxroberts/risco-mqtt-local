name: Home Assistant add-on images

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true
      image-tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show native build architecture
        run: |
          uname -m
          docker info --format '{{.Architecture}}'
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build add-on
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: addon
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.publish }}
          tags: ghcr.io/${{ github.repository }}-addon-${{ matrix.arch }}:${{ inputs.image-tag }}
